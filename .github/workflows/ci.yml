name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходный код репозитория
        uses: actions/checkout@v7

      - name: Настроить Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Установить зависимости
        run: npm ci

      - name: Запустить ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Получить исходный код репозитория
        uses: actions/checkout@v7

      - name: Настроить Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Установить зависимости
        run: npm ci

      - name: Запустить тесты
        run: npm test
